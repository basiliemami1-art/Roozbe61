name: Build

on:
  push:
    branches: [main, master]
    # A version tag builds the same way and publishes a permanent release
    # instead of overwriting the rolling one.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately: the libbox PlatformInterface is an unstable API and the
  # Kotlin implementation in app/src/main/java/com/gozar/app/vpn is written
  # against exactly this tag. Bump both together.
  #
  # Exactly one gomobile-generated AAR may ship in the APK. Every one of them
  # bundles the same unnamespaced `go.*` runtime and binds `go.Seq` to its own
  # native library, so adding a second core collides on `go.Seq` at merge time
  # and would leave one core's JNI unregistered even if the classes were merged.
  SING_BOX_VERSION: v1.13.15
  GRADLE_VERSION: 8.11.1
  # sing-box links a prebuilt libcronet.a (pulled in by with_naive_outbound)
  # that carries relocations r27's ld.lld rejects with "unknown reloc", so the
  # NDK has to be at least r28.
  NDK_VERSION: 28.2.13676358

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 17 is not a preference: sing-box's build_libbox hard-checks the java
      # banner for "openjdk 17" and aborts on anything else. AGP 8.7 and
      # Gradle 8.11 both run fine on 17, so one JDK serves the whole job.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and NDK
        run: |
          set -eo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null \
            || echo "::warning::sdkmanager could not install ndk;${NDK_VERSION}"
          AVAILABLE="$(ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | sort -V | tr '\n' ' ')"
          echo "::warning title=NDKs available::${AVAILABLE:-none}"
          # Prefer the pinned NDK; otherwise take the newest present, since the
          # failure mode we are avoiding is a linker that is too old.
          if [ -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" ]; then
            NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          else
            NDK_DIR="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)"
            echo "::warning::Pinned NDK $NDK_VERSION unavailable, falling back to $NDK_DIR"
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No Android NDK found; gomobile cannot build libbox."
            exit 1
          fi
          echo "Using NDK at $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Cache sing-box build
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SING_BOX_VERSION }}-ndk-${{ env.NDK_VERSION }}

      # sing-box publishes no prebuilt Android artifact, so the core is compiled
      # from the pinned tag with gomobile. This is the slow step (~6-10 min) and
      # is cached on the tag.
      - name: Build sing-box core (libbox.aar)
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          echo "go:  $(go version)"
          echo "ndk: $ANDROID_NDK_HOME"
          echo "sdk: $ANDROID_SDK_ROOT"
          echo "disk: $(df -h / | tail -1)"

          # The whole build is captured so a failure can be reported as a check
          # annotation. Annotations are readable on a public repo without admin
          # rights, unlike the raw job log.
          build() {
            set -e
            git clone --depth 1 --branch "$SING_BOX_VERSION" \
              https://github.com/SagerNet/sing-box.git /tmp/sing-box
            cd /tmp/sing-box
            make lib_install
            export PATH="$PATH:$(go env GOPATH)/bin"
            gomobile version || true
            gomobile init || true
            make lib_android
          }

          if build 2>&1 | tee /tmp/libbox-build.log; then
            mkdir -p "$GITHUB_WORKSPACE/app/libs"
            cp /tmp/sing-box/libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
            ls -lh "$GITHUB_WORKSPACE/app/libs/"
          else
            SNIPPET="$(tail -40 /tmp/libbox-build.log | sed 's/%/%25/g; s/\r/ /g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=libbox build failed::${SNIPPET}"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Configuration errors surface here first, since this is the first command
      # that evaluates the build scripts — so it needs the same error reporting
      # as the compile step.
      - name: Generate Gradle wrapper
        run: |
          set -o pipefail
          if gradle wrapper --gradle-version "$GRADLE_VERSION" --console=plain 2>&1 | tee /tmp/wrapper.log; then
            exit 0
          fi
          SNIPPET="$(tail -60 /tmp/wrapper.log | sed 's/%/%25/g; s/\r/ /g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Gradle configuration failed::${SNIPPET}"
          exit 1

      # Secrets are not usable in a step-level `if`, so the decision is made in
      # the shell. With no keystore configured the build falls back to the debug
      # signing key, which still produces an installable APK.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No keystore secret; signing with the debug key."
          fi

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ./gradlew :app:assembleRelease --console=plain 2>&1 | tee /tmp/gradle.log; then
            exit 0
          fi
          # Compiler diagnostics first, then the tail, re-emitted as an
          # annotation so they are readable without admin access to the log.
          {
            grep -E "^(e|w): |FAILURE|Caused by|> Task .*FAILED|error:" /tmp/gradle.log | head -40
            echo "--- tail ---"
            tail -25 /tmp/gradle.log
          } > /tmp/gradle-errors.txt
          SNIPPET="$(sed 's/%/%25/g; s/\r/ /g' /tmp/gradle-errors.txt | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Gradle build failed::${SNIPPET}"
          exit 1

      - name: List outputs
        run: |
          echo "### APKs" >> "$GITHUB_STEP_SUMMARY"
          echo '| file | size |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/release/*.apk; do
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Install **app-arm64-v8a-release.apk** unless you know you need another ABI.' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gozar-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Windows
  #
  # A separate job on a Windows runner: jpackage can only produce an installer
  # for the platform it runs on. The desktop app does not use a TUN device, so
  # it needs the plain sing-box binary rather than the gomobile build the phone
  # app links against — which also means this job does not need Go or the NDK.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the sing-box core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ env.SING_BOX_VERSION }}'.TrimStart('v')
          $name = "sing-box-$version-windows-amd64"
          $url = "https://github.com/SagerNet/sing-box/releases/download/${{ env.SING_BOX_VERSION }}/$name.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile core.zip
          Expand-Archive core.zip -DestinationPath core -Force
          New-Item -ItemType Directory -Force desktop/resources/windows | Out-Null
          Copy-Item "core/$name/sing-box.exe" desktop/resources/windows/sing-box.exe
          Get-Item desktop/resources/windows/sing-box.exe | Select-Object Name,Length

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build the installer
        shell: bash
        run: |
          set -o pipefail
          # Only the desktop module: this runner has no Android SDK and does not
          # need one.
          if gradle :desktop:packageReleaseMsi --console=plain 2>&1 | tee /tmp/desktop.log; then
            exit 0
          fi
          SNIPPET="$( { grep -E "^(e|w): |FAILURE|Caused by|> Task .*FAILED|error:" /tmp/desktop.log | head -40; echo '--- tail ---'; tail -25 /tmp/desktop.log; } | sed 's/%/%25/g; s/\r/ /g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Windows build failed::${SNIPPET}"
          exit 1

      - name: Where the build put the core
        shell: bash
        run: |
          # Informational: the staging layout is not obvious, and knowing it
          # makes the authoritative check below easy to interpret.
          find desktop/build -name 'sing-box.exe' -printf '%p  %s bytes\n' 2>/dev/null || true

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist
          find desktop/build/compose/binaries -name '*.msi' -exec cp {} dist/ \;
          ls -lh dist/

      # The only check that means anything: what is actually inside the file the
      # user downloads. Without the core the app cannot connect to a single
      # server, and nothing in it points at why — so this must never ship broken.
      - name: Verify the core is inside the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem dist -Filter *.msi | Select-Object -First 1).FullName
          $out = Join-Path $env:RUNNER_TEMP 'msi-payload'
          # An administrative install unpacks the payload without installing it.
          Start-Process msiexec -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$out`"" -Wait -NoNewWindow
          $found = Get-ChildItem $out -Recurse -Filter sing-box.exe -ErrorAction SilentlyContinue
          if (-not $found) {
            $tree = (Get-ChildItem $out -Recurse -Directory -ErrorAction SilentlyContinue |
              Select-Object -First 40 -ExpandProperty FullName) -join '%0A'
            Write-Host "::error title=Core missing from installer::sing-box.exe is not in the MSI payload. Directories:%0A$tree"
            exit 1
          }
          $found | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 1)
            Write-Host "core in installer: $($_.FullName) ($mb MB)"
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: gozar-windows
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Release
  #
  # Artifacts need a signed-in GitHub account to download, which makes them
  # useless for handing someone an APK. A release asset is a plain URL.
  #
  # One job publishes both platforms: when each job wrote to the rolling tag
  # itself they raced to create the same release. It still runs when the
  # Windows job fails, so a broken desktop build never withholds the APK.
  #
  # A tagged build additionally requires the Windows job to have succeeded — a
  # published version must not be missing half of what it claims to ship.
  release:
    needs: [build, windows]
    # On one line deliberately. In a folded scalar YAML keeps the newline of any
    # line indented further than the first, and a newline inside an expression
    # makes the whole workflow invalid — it fails before any job starts, with no
    # annotation to say why.
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List what will be published
        run: find dist -type f -printf '%p  %s bytes\n'

      # A version tag must ship both platforms. Catching that here rather than
      # after publishing is the difference between a release and a retraction.
      - name: A tagged release must have both platforms
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MISSING=""
          ls dist/gozar-apk/*.apk >/dev/null 2>&1 || MISSING="$MISSING apk"
          ls dist/gozar-windows/*.msi >/dev/null 2>&1 || MISSING="$MISSING msi"
          if [ -n "$MISSING" ]; then
            echo "::error title=Incomplete release::Missing:$MISSING"
            exit 1
          fi
          echo "both platforms present"

      # Every push to main refreshes this one, so there is always a current
      # build to hand someone without cutting a version.
      - name: Rolling build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build of `${{ github.sha }}`. For a stable version see
            the [releases page](../../releases).

            **Android** — install `app-arm64-v8a-release.apk` unless you know
            you need another ABI.
            **Windows** — install the `.msi`; no administrator rights needed.
          files: |
            dist/gozar-apk/*.apk
            dist/gozar-windows/*.msi
          prerelease: true
          make_latest: false

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Gozar ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/gozar-apk/*.apk
            dist/gozar-windows/*.msi
          prerelease: false
          make_latest: true
