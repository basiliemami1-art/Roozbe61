name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately: the libbox PlatformInterface is an unstable API and the
  # Kotlin implementation in app/src/main/java/com/gozar/app/vpn is written
  # against exactly this tag. Bump both together.
  SING_BOX_VERSION: v1.13.15
  XRAY_LIB_VERSION: v26.7.31
  GRADLE_VERSION: 8.11.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and NDK
        run: |
          set -eo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          # Pinning an exact NDK build number breaks whenever the runner image
          # rotates, so try a known-good one and fall back to whatever is there.
          sdkmanager --install "ndk;27.2.12479018" > /dev/null || true
          NDK_DIR="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No Android NDK found; gomobile cannot build libbox."
            exit 1
          fi
          echo "Using NDK at $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Cache sing-box build
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SING_BOX_VERSION }}-ndk27

      # sing-box publishes no prebuilt Android artifact, so the core is compiled
      # from the pinned tag with gomobile. This is the slow step (~6-10 min) and
      # is cached on the tag.
      - name: Build sing-box core (libbox.aar)
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init || true
          make lib_android
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          ls -lh "$GITHUB_WORKSPACE/app/libs/"

      - name: Fetch Xray core (libv2ray.aar)
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fSL -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${XRAY_LIB_VERSION}/libv2ray.aar"
          ls -lh app/libs/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version "$GRADLE_VERSION"

      # Secrets are not usable in a step-level `if`, so the decision is made in
      # the shell. With no keystore configured the build falls back to the debug
      # signing key, which still produces an installable APK.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No keystore secret; signing with the debug key."
          fi

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List outputs
        run: |
          echo "### APKs" >> "$GITHUB_STEP_SUMMARY"
          echo '| file | size |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/release/*.apk; do
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Install **app-arm64-v8a-release.apk** unless you know you need another ABI.' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gozar-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
